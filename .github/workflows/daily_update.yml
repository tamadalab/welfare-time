name: 毎朝のデータ更新（食堂＆キッチンカー）

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日UTC 22:00（JST 07:00 相当）
  workflow_dispatch: {}

concurrency:
  group: welfare-time-daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Python をセットアップする
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Hugo をセットアップする
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: just をセットアップする
        uses: extractions/setup-just@v4

      - name: Node をセットアップする
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: 依存パッケージをインストールする
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 食堂データを更新する
        run: |
          just fetch_cafeteria
          just parse_pdf

      - name: キッチンカーデータを更新する
        run: |
          just fetch_kitchencar
          just parse_kitchencar

      - name: APIデータを生成する
        run: just generate

      - name: 入力データをmainにコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/pdfs data/kitchen_cars_past.json
          if git diff --cached --quiet; then
            echo "No source data changes"
            exit 0
          fi

          git commit -m "Update source data: $(date +'%Y-%m-%d')"
          # ジョブ実行中にmainが進んでいる場合に備えてrebaseしてからpushする。
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: NPMパッケージをインストールする
        run: npm ci

      - name: gh-pagesブランチにデプロイする
        run: |
          # gh-pagesブランチをpublicディレクトリにworktreeとして追加
          git fetch origin gh-pages
          git worktree add public gh-pages

          # 過去に公開した食堂データが今回の生成結果から消えていたら公開しない。
          python3 scripts/validate_cafeteria_history.py \
            --previous public/api/schedule \
            --current static/api/schedule

          # api配下は完全な生成物なので、毎回作り直して古いIDのファイルが
          # 残り続けないようにする。daily配下のPDFは累積するため消さない。
          rm -rf public/api

          just build_html

      - name: サイトをgh-pagesにコミットしてpushする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd public
          git add .
          git commit -m "Update site data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin gh-pages
