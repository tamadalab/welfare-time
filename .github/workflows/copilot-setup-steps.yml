name: Copilot Setup Steps

# Copilot coding agent が作業を始める前に実行する環境構築。
# ジョブ名は copilot-setup-steps でなければ Copilot に認識されない。
# 内容は毎朝のデータ更新（daily_update.yml）とそろえる。

on:
  workflow_dispatch: {}
  # このファイルを変更したときに、実際に動くことを確認する
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6

      - name: Python をセットアップする
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Hugo をセットアップする
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: just をセットアップする
        uses: extractions/setup-just@v4

      - name: Node をセットアップする
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: 依存パッケージをインストールする
        run: |
          pip install -r requirements.txt
          playwright install chromium
          npm ci
